[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nostr-mcp-auth"
version = "1.0.0"
description = "Fail-closed NIP-98 auth for HTTP MCP: agents prove a Nostr identity or tools never run"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "SamsonCyber" }]
keywords = ["nostr", "mcp", "nip-98", "auth", "security", "agents"]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "starlette>=0.38",
    "uvicorn>=0.30",
    "coincurve>=20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/SamsonCyber/nostr-mcp-auth"
Repository = "https://github.com/SamsonCyber/nostr-mcp-auth"

[project.scripts]
nostr-mcp-auth = "nostr_mcp_auth.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nostr_mcp_auth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
